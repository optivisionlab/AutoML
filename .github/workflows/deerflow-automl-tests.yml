# ══════════════════════════════════════════════════════════
# DeerFlow-AutoML — CI/CD Test Workflow (Complete)
#
# 3 jobs:
# 1. unit-test: Mock LLM — test nhanh tất cả modules
# 2. integration-test: Ollama — test end-to-end với model thật
# 3. e2e-test: End-user flow — test toàn bộ pipeline
# ══════════════════════════════════════════════════════════

name: DeerFlow-AutoML Tests

on:
  push:
    branches:
      - features/deerflow-automl
      - features/hagent
      - main
    paths:
      - "src/backend/**"
      - ".github/workflows/deerflow-automl-tests.yml"
  pull_request:
    branches:
      - main
      - features/deerflow-automl
    paths:
      - "src/backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════
  # Job 1: Unit Tests — Mock LLM (nhanh, ~3 phút)
  # ════════════════════════════════════════════════════════
  unit-test:
    name: "🧪 Unit Tests (Mock LLM)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: src/backend
      HAGENT_CONFIG: ${{ github.workspace }}/src/backend/hagent/hagent.yaml
      HAUTOML_BASE_URL: http://localhost:8585
      MONGODB_CONNECT: localhost:27017
      MONGODB_DB_NAME: hagent_test
      OPENAI_API_KEY: "ci-mock-key-not-real"
      ANTHROPIC_API_KEY: "ci-mock-key-not-real"
      LLM_DEFAULT_MODEL: "ci-mock"
      LANGCHAIN_TRACING_V2: "false"
      DO_NOT_TRACK: "1"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: 📦 Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx

      - name: 🔍 Python syntax check (auto-discover)
        working-directory: src/backend
        run: |
          python -c "
          import ast, sys, pathlib
          all_py = list(pathlib.Path('hagent').rglob('*.py'))
          all_py += list(pathlib.Path('tests').rglob('*.py'))
          errors = []
          for f in all_py:
              if '__pycache__' in str(f):
                  continue
              try:
                  with open(f) as fh:
                      ast.parse(fh.read())
              except SyntaxError as e:
                  print(f'✗ {f}: {e}')
                  errors.append(str(f))
          if errors:
              sys.exit(1)
          print(f'All {len(all_py)} Python files syntax OK ✓')
          "

      - name: 📋 Validate hagent.yaml
        working-directory: src/backend
        run: |
          python -c "
          import yaml, sys
          with open('hagent/hagent.yaml') as f:
              cfg = yaml.safe_load(f)
          checks = {
              'llm section': 'llm' in cfg,
              'llm.models': isinstance(cfg.get('llm', {}).get('models'), list),
              'agent section': 'agent' in cfg,
              'agent.subagents': 'subagents' in cfg.get('agent', {}),
              'agent.routing': 'routing' in cfg.get('agent', {}),
              'agent.suggestions': 'suggestions' in cfg.get('agent', {}),
              'memory section': 'memory' in cfg,
              'middlewares section': 'middlewares' in cfg,
              'error_messages': 'error_messages' in cfg,
              'prompt file path': 'system_prompt_path' in cfg.get('agent', {}),
          }
          all_ok = True
          for name, ok in checks.items():
              symbol = '✓' if ok else '✗'
              print(f'{symbol} {name}')
              if not ok:
                  all_ok = False
          if not all_ok:
              sys.exit(1)
          print(f'\nAll {len(checks)} YAML checks passed ✓')
          "

      - name: 🤖 Start Mock LLM Server
        working-directory: src/backend
        run: |
          python tests/mock_llm_server.py --port 11435 &
          MOCK_PID=$!
          echo "MOCK_LLM_PID=$MOCK_PID" >> $GITHUB_ENV

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11435/health > /dev/null 2>&1; then
              echo "✓ Mock LLM Server ready (PID: $MOCK_PID)"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:11435/health | python -m json.tool

      - name: 🧪 Phase 1 — Foundation Tests
        working-directory: src/backend
        run: |
          python -m pytest tests/test_deerflow_automl.py \
            -v \
            --timeout=60 \
            --tb=short \
            -x \
            -m "not ollama" \
            --color=yes \
            2>&1 | tee test_results.txt

      - name: 🤖 Phase 2 — Multi-Agent Tests
        working-directory: src/backend
        run: |
          python -m pytest tests/test_phase2_multiagent.py \
            -v \
            --timeout=60 \
            --tb=short \
            -x \
            --color=yes \
            2>&1 | tee -a test_results.txt

      - name: 🧠 Phase 3 — Context Engineering Tests
        working-directory: src/backend
        run: |
          python -m pytest tests/test_phase3_context.py \
            -v \
            --timeout=60 \
            --tb=short \
            -x \
            --color=yes \
            2>&1 | tee -a test_results.txt

      - name: 🌍 World State Tests
        working-directory: src/backend
        run: |
          python -m pytest tests/test_world_state_store.py \
            -v \
            --timeout=30 \
            --tb=short \
            --color=yes \
            2>&1 | tee -a test_results.txt

      - name: 🧹 Cleanup Mock Server
        if: always()
        run: |
          if [ -n "$MOCK_LLM_PID" ]; then
            kill $MOCK_LLM_PID 2>/dev/null || true
          fi

      - name: 📊 Unit Test Summary
        if: always()
        working-directory: src/backend
        run: |
          echo "## 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test_results.txt ]; then
            SUMMARY=$(tail -5 test_results.txt | head -3)
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════
  # Job 2: Integration Tests — Ollama + Model thật
  # Test toàn bộ hệ thống với LLM thật
  # ════════════════════════════════════════════════════════
  integration-test:
    name: "🦙 Integration Tests (Ollama)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-test

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: src/backend
      HAGENT_CONFIG: ${{ github.workspace }}/src/backend/hagent/hagent.yaml
      HAUTOML_BASE_URL: http://localhost:8585
      MONGODB_CONNECT: localhost:27017
      MONGODB_DB_NAME: hagent_test
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: "qwen2.5:7b"
      LLM_DEFAULT_MODEL: "ollama-ci"
      OPENAI_API_KEY: "not-needed-for-ollama"
      ANTHROPIC_API_KEY: "not-needed-for-ollama"
      LANGCHAIN_TRACING_V2: "false"
      DO_NOT_TRACK: "1"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: 📦 Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx

      # ── Ollama Setup ──────────────────────────────────────
      - name: 🦙 Install Ollama
        run: |
          echo "=== Installing Ollama ==="
          curl -fsSL https://ollama.com/install.sh | sh
          echo "✓ Ollama installed: $(ollama --version)"

      - name: 🚀 Start Ollama Server
        run: |
          echo "=== Starting Ollama server ==="
          ollama serve &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV

          echo "Waiting for Ollama server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✓ Ollama server ready (PID: $OLLAMA_PID)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Ollama server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: 📥 Pull Model (${{ env.OLLAMA_MODEL }})
        run: |
          echo "=== Pulling $OLLAMA_MODEL ==="
          echo "  (qwen2.5:7b ≈ 4.7GB — hỗ trợ tool calling)"
          ollama pull $OLLAMA_MODEL

          echo ""
          echo "=== Verify model ==="
          ollama list
          echo "✓ Model $OLLAMA_MODEL ready"

      - name: 🔥 Warm up model
        run: |
          echo "=== Warming up model ==="
          curl -sf http://localhost:11434/api/generate \
            -d "{\"model\": \"$OLLAMA_MODEL\", \"prompt\": \"Hello\", \"stream\": false}" \
            | python -m json.tool | head -5
          echo "✓ Model warmed up"

      # ── Run All Tests with Real Model ──────────────────────
      - name: 🧪 Phase 1 — Ollama Integration Tests
        working-directory: src/backend
        run: |
          python -m pytest tests/test_deerflow_automl.py \
            -v \
            --timeout=120 \
            --tb=short \
            -m "ollama" \
            --color=yes \
            2>&1 | tee ollama_test_results.txt

      - name: 🤖 Phase 2 — Multi-Agent with Real LLM
        working-directory: src/backend
        run: |
          python -m pytest tests/test_phase2_multiagent.py \
            -v \
            --timeout=120 \
            --tb=short \
            --color=yes \
            2>&1 | tee -a ollama_test_results.txt

      - name: 🧠 Phase 3 — Context Engineering with Real LLM
        working-directory: src/backend
        run: |
          python -m pytest tests/test_phase3_context.py \
            -v \
            --timeout=120 \
            --tb=short \
            --color=yes \
            2>&1 | tee -a ollama_test_results.txt

      # ── End-to-End User Flow Test ──────────────────────────
      - name: 🎯 E2E — End-User Flow Test
        working-directory: src/backend
        run: |
          python scripts/e2e_test.py

      # ── Cleanup ───────────────────────────────────────────
      - name: 🧹 Cleanup
        if: always()
        run: |
          if [ -n "$OLLAMA_PID" ]; then
            kill $OLLAMA_PID 2>/dev/null || true
            echo "Ollama server stopped"
          fi

      - name: 📊 Integration Test Summary
        if: always()
        working-directory: src/backend
        run: |
          echo "## 🦙 Integration + E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** $OLLAMA_MODEL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ollama_test_results.txt ]; then
            SUMMARY=$(tail -5 ollama_test_results.txt | head -3)
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
