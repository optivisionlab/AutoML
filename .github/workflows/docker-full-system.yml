# ══════════════════════════════════════════════════════════
# DeerFlow-AutoML — Docker-based Full System Integration Tests
#
# Runs the entire AutoML backend and multi-agent system on
# Docker Compose using real database services and a real LLM.
# ══════════════════════════════════════════════════════════

name: "🐳 Full System Docker E2E"

on:
  push:
    branches:
      - features/deerflow-automl
      - features/hagent
      - main
    paths:
      - "src/backend/**"
      - ".github/workflows/docker-full-system.yml"
  pull_request:
    branches:
      - main
      - features/deerflow-automl
    paths:
      - "src/backend/**"

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    name: "🐳 Docker E2E & AutoML Worker"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:14b"
      LLM_DEFAULT_MODEL: "ollama-ci"

    steps:
      # ── Checkout Code ──────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── Setup Python (on Host for Test Runner) ─────────
      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: 📦 Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # ── Ollama Setup (on Host) ─────────────────────────
      - name: 🦙 Install Ollama
        run: |
          echo "=== Installing Ollama ==="
          curl -fsSL https://ollama.com/install.sh | sh
          echo "✓ Ollama installed: $(ollama --version)"

      - name: 🚀 Start Ollama Server
        run: |
          ollama serve &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV

          echo "Waiting for Ollama server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✓ Ollama server ready (PID: $OLLAMA_PID)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Ollama server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: 📥 Pull Model (${{ env.OLLAMA_MODEL }})
        run: |
          echo "=== Pulling $OLLAMA_MODEL ==="
          ollama pull $OLLAMA_MODEL
          echo ""
          echo "=== Verify model ==="
          ollama list
          echo "✓ Model $OLLAMA_MODEL ready"

      - name: 🔥 Warm up model
        run: |
          echo "=== Warming up model ==="
          curl -sf http://localhost:11434/api/generate \
            -d "{\"model\": \"$OLLAMA_MODEL\", \"prompt\": \"Hello\", \"stream\": false}" \
            | python -m json.tool | head -5
          echo "✓ Model warmed up"

      # ── Start Docker System ────────────────────────────
      - name: ⚙️ Prepare environment configuration
        working-directory: src/backend
        run: |
          # Create .env file with CI-appropriate values inline
          cat > .env <<'ENVFILE'
          SECRET_KEY=ci-secret-key-for-testing
          ALGORITHM=HS256
          ACCESS_EXPIRE=60
          REFRESH_EXPIRE=7
          HAGENT_HOOKS_TOKEN=ci-hagent-hooks-token
          SKIP_EMAIL_VERIFICATION=true
          CUSTOM_API_KEY=sk-ci-test-key

          TOOLKIT_IMAGE=hautoml-toolkit
          TOOLKIT_CONTAINER_NAME=toolkit-testing
          TOOLKIT_HOST_PORT=5370
          TOOLKIT_PORT=8585

          WORKER_IMAGE=workers:latest
          WORKER_CONTAINER_NAME=hautoml-woker-1-testing
          WORKER_PORT=5101
          WORKER_INDEX=1

          MONGO_IMAGE=mongo:latest
          MONGO_CONTAINER_NAME=mongodb_hautoml_testing
          MONGO_HOST_PORT=5380
          MONGO_DATA_DIR=/tmp/mongo-automl-ci
          MONGODB_DB_NAME=hautoml

          KAFKA_IMAGE=apache/kafka:latest
          KAFKA_CONTAINER_NAME=kafka-testing
          KAFKA_HOST_PORT=5383
          KAFKA_TOPIC=example-topic

          MINIO_IMAGE=minio/minio:latest
          MINIO_CONTAINER_NAME=minio_hautoml_testing
          MINIO_HOST_PORT=5381
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin

          HAGENT_BRIDGE_IMAGE=hagent-bridge:latest
          HAGENT_BRIDGE_CONTAINER_NAME=hagent_bridge_testing
          HAGENT_BRIDGE_HOST_PORT=5360
          HAGENT_BRIDGE_PORT=9900

          OPENCLAW_IMAGE=ghcr.io/openclaw/openclaw:latest
          OPENCLAW_CONTAINER_NAME=openclaw_gateway_testing
          OPENCLAW_HOST_PORT=5361
          OPENCLAW_GATEWAY_PORT=18789
          OPENCLAW_PROXY_PORT=18790
          OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
          OPENCLAW_BUNDLED_PLUGINS_DIR=/app/extensions
          ENVFILE

          # Inject CI-specific Ollama variables
          echo "OLLAMA_BASE_URL=${OLLAMA_BASE_URL}" >> .env
          echo "OLLAMA_MODEL=${OLLAMA_MODEL}" >> .env

          echo "✓ .env file created"
          cat .env

      - name: 🏗️ Build AutoML Worker image
        run: |
          docker build -t workers:latest -f src/backend/worker.dockerfile src/backend

      - name: 🚀 Start full system via Docker Compose
        run: |
          docker compose -f src/backend/docker-compose.yaml --profile worker up --build -d

      - name: 🔍 Show container status after startup
        run: |
          echo "=== CONTAINER STATUS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== BRIDGE CONTAINER LOGS (early) ==="
          docker logs hagent_bridge_testing 2>&1 | tail -30 || echo "(no logs yet)"
          echo ""
          echo "=== TOOLKIT CONTAINER LOGS (early) ==="
          docker logs toolkit-testing 2>&1 | tail -30 || echo "(no logs yet)"

      - name: ⏳ Wait for services to be ready
        run: |
          echo "Waiting for HAutoML and HAgent Bridge to pass health checks..."
          for i in {1..60}; do
            AUTOML_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5370/home || echo "000")
            BRIDGE_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5360/api/v1/chat/health || echo "000")
            
            echo "Attempt $i/60: AutoML=$AUTOML_HEALTH, Bridge=$BRIDGE_HEALTH"
            if [ "$AUTOML_HEALTH" = "200" ] && [ "$BRIDGE_HEALTH" = "200" ]; then
              echo "✓ All systems are healthy and ready!"
              break
            fi
            
            # Print bridge container logs every 10 attempts to diagnose failures
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Bridge container logs (attempt $i) ---"
              docker logs hagent_bridge_testing 2>&1 | tail -20 || true
              echo "--- Toolkit container logs (attempt $i) ---"
              docker logs toolkit-testing 2>&1 | tail -20 || true
              echo "---"
            fi

            if [ $i -eq 60 ]; then
              echo "✗ Timeout waiting for Docker services to start"
              echo ""
              echo "=== ALL CONTAINER STATUS ==="
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo ""
              echo "=== BRIDGE LOGS ==="
              docker logs hagent_bridge_testing 2>&1 | tail -50 || true
              echo ""
              echo "=== TOOLKIT LOGS ==="
              docker logs toolkit-testing 2>&1 | tail -50 || true
              exit 1
            fi
            sleep 5
          done

      # ── Execute E2E Tests ──────────────────────────────
      - name: 🧪 Run Docker-based E2E System Tests
        run: |
          python src/backend/scripts/e2e_docker_test.py

      # ── Troubleshooting logs ───────────────────────────
      - name: 📊 Print docker-compose logs on failure
        if: failure()
        run: |
          echo "=== DOCKER COMPOSE FULL LOGS ==="
          docker compose -f src/backend/docker-compose.yaml logs --tail=200

      # ── Cleanup ────────────────────────────────────────
      - name: 🧹 Cleanup containers and servers
        if: always()
        run: |
          echo "Stopping Docker containers..."
          docker compose -f src/backend/docker-compose.yaml --profile worker down -v
          
          if [ -n "$OLLAMA_PID" ]; then
            echo "Stopping Ollama server (PID: $OLLAMA_PID)..."
            kill $OLLAMA_PID 2>/dev/null || true
          fi
          echo "✓ Cleanup done."
