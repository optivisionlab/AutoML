name: Agent Train Student Dataset

on:
  push:
    paths:
      - ".github/workflows/agent-train-student.yml"
      - "src/backend/scripts/run_agent_training_action.py"
  workflow_dispatch:

jobs:
  run-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src/backend
      HAGENT_CONFIG: ${{ github.workspace }}/src/backend/hagent/hagent.yaml
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: "qwen2.5:7b"
      LLM_PROVIDER: "ollama"
      LLM_MODEL: "qwen2.5:7b"
      HAUTOML_BASE_URL: http://localhost:8585
      MONGODB_CONNECT: localhost:27017
      MONGODB_DB_NAME: hagent_test
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx fastapi uvicorn

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama..."
          sleep 5
          ollama pull qwen2.5:7b

      - name: Start Mock HAutoML Server
        working-directory: src/backend
        run: |
          python scripts/mock_hautoml_server.py &
          sleep 3

      - name: Run Agent (Train & Generate Report)
        working-directory: src/backend
        run: python scripts/run_agent_training_action.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/backend/docs/Student_Training_Report.md
          git commit -m "docs: agent generated student training report [skip ci]" || echo "No changes"
          git push
