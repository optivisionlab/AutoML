metric_list: [mse, mae, rmse, r2]
Forecasting_models:
  0:
    model: Ridge
    params:
      - alpha: [0.1, 1.0, 10.0]
  1:
    model: RandomForestRegressor
    params:
      - n_estimators: [50, 100]
        max_depth: [3, 8]
        min_samples_leaf: [1, 3]
  2:
    model: GradientBoostingRegressor
    params:
      - n_estimators: [50, 100]
        learning_rate: [0.05, 0.1]
        max_depth: [2, 3]
