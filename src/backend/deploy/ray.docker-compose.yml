services:
  # ==========================================
  # 1. Ray Head Node
  # ==========================================
  headnode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: base-worker
    image: clusters:latest
    container_name: headnode
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "7776:7776"
      - "7777:7777"
    command: >
      ray start --head
        --port=7776
        --ray-client-server-port=7777
        --include-dashboard=false
        --block
    networks:
      - hautoml_net

  # ==========================================
  # 2. Ray Worker Nodes
  # ==========================================
  workernode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: base-worker
    image: clusters:latest
    restart: unless-stopped
    shm_size: "2gb"
    depends_on:
      - headnode
    command: ray start --address=headnode:7776 --block
    deploy:
      replicas: 2
    networks:
      - hautoml_net

networks:
  hautoml_net:
    name: hautoml_net
    external: true
