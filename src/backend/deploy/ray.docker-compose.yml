services:
  # ==========================================
  # 1. Redis Storage for Ray GCS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass password123 --user admin on >password123 ~* &* +@all
    networks:
      - hautoml_net

  # ==========================================
  # 2. Ray Head Node
  # ==========================================
  headnode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: base-worker
    image: clusters:latest
    container_name: headnode
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "7776:7776"
      - "7777:7777"
    command: >
      ray start --head
        --port=7776
        --ray-client-server-port=7777
        --include-dashboard=false
        --block
    networks:
      - hautoml_net

  # ==========================================
  # 3. Ray Worker Nodes
  # ==========================================
  workernode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: base-worker
    restart: unless-stopped
    shm_size: "2gb"
    depends_on:
      - headnode
    command: ray start --address=headnode:7776 --block
    deploy:
      replicas: 2
    networks:
      - hautoml_net

networks:
  hautoml_net:
    name: hautoml_net
    external: true

volumes:
  redis_data:
