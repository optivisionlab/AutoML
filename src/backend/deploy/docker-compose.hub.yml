# HAutoML chạy hoàn toàn từ image trên Docker Hub (không cần mã nguồn)
#
#   docker compose -f docker-compose.hub.yml up -d     # chạy (lần đầu sẽ pull image)
#   docker compose -f docker-compose.hub.yml pull      # lấy bản image mới nhất của tag
#   docker compose -f docker-compose.hub.yml down      # dừng (thêm -v để xóa luôn dữ liệu)
#
# API/Swagger: http://localhost:9996/docs · MinIO console: http://localhost:9001
# Cần trống các cổng 9996, 27017, 9000, 9001, 9092, 9093, 1883, 1884.
# Mật khẩu/khóa bên dưới chỉ dùng để chạy thử trên máy cá nhân.

name: hautoml-hub

x-backend: &backend
  image: dutamoi/hautoml-backend:pipeline-json
  restart: unless-stopped
  environment:
    BACKEND_HOST: 0.0.0.0
    BACKEND_PORT: "9996"
    FRONTEND_URL: http://localhost:3000
    MONGODB_CONNECT: mongodb://mongo:27017
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: admin
    MINIO_SECRET_KEY: password123456
    KAFKA_SERVER: kafka:9092
    KAFKA_TOPIC: train-job-topic
    MQTT_HOSTNAME: mqtt
    MQTT_PORT: "1883"
    MQTT_USERNAME: admin
    MQTT_PASSWORD: password123
    SECRET_KEY: hautoml-hub-local-jwt-secret
    MAPREDUCE_MODE: local
  depends_on:
    - mongo
    - minio
    - kafka
    - mqtt

services:
  hautoml-service:
    <<: *backend
    command: ["python", "-m", "src.main"]
    ports:
      - "9996:9996"

  hautoml-consumer:
    <<: *backend
    command: ["python", "-m", "src.kafka_consumer"]

  mqtt:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "1884:1884"
    environment:
      MQTT_USERNAME: admin
      MQTT_PASSWORD: password123
    volumes:
      - mqtt_data:/mosquitto/data
    # Cấu hình giống deploy/mosquitto/mosquitto.conf, ghi trực tiếp để không cần file đi kèm
    command: >
      sh -c "
      printf 'listener 1883\nprotocol mqtt\nlistener 1884\nprotocol websockets\nallow_anonymous false\npassword_file /mosquitto/config/passwd\nlog_dest stdout\n' > /mosquitto/config/mosquitto.conf &&
      rm -f /mosquitto/config/passwd &&
      mosquitto_passwd -c -b /mosquitto/config/passwd $$MQTT_USERNAME $$MQTT_PASSWORD &&
      chown mosquitto:mosquitto /mosquitto/config/passwd &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "

  minio:
    # quay.io/minio/minio không còn pull tự do được; dùng bản build lại trên Docker Hub
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mqtt_data:
  minio_data:
  kafka_data:
  mongo_data:
