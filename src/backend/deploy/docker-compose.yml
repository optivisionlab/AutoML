services:
  # ==========================================
  # 1. HAutoML Toolkit Service (Standalone Demo UI)
  # ==========================================
  toolkit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: toolkit
    container_name: hautoml_toolkit
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-7860}:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    networks:
      - hautoml_net

  # ==========================================
  # 2. HAutoML Backend API Service
  # ==========================================
  hautoml-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    container_name: hautoml_service
    restart: unless-stopped
    command: ["python", "-m", "src.main"]
    ports:
      - "${PORT_BACK_END:-9999}:9999"
    env_file:
      - ../.env
    environment:
      - MONGODB_CONNECT=mongodb://mongodb:27017
      - MINIO_ENDPOINT=minio:9000
      - KAFKA_SERVER=kafka:9092
      - MQTT_HOSTNAME=mqtt_broker
    depends_on:
      - mongo
      - minio
      - kafka
      - mqtt
    networks:
      - hautoml_net

  # ==========================================
  # 3. HAutoML Training Consumer (Kafka Worker)
  # ==========================================
  hautoml-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    container_name: hautoml_consumer
    restart: unless-stopped
    command: ["python", "-m", "src.kafka_consumer"]
    env_file:
      - ../.env
    environment:
      - MONGODB_CONNECT=mongodb://mongodb:27017
      - MINIO_ENDPOINT=minio:9000
      - KAFKA_SERVER=kafka:9092
      - MQTT_HOSTNAME=mqtt_broker
    depends_on:
      - kafka
      - mongo
      - minio
    networks:
      - hautoml_net

  # ==========================================
  # 4. MQTT Broker (Mosquitto)
  # ==========================================
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "1884:1884"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-admin}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-password123}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    command: >
      sh -c "
      rm -f /mosquitto/config/passwd &&
      mosquitto_passwd -c -b /mosquitto/config/passwd $$MQTT_USERNAME $$MQTT_PASSWORD && 
      chown mosquitto:mosquitto /mosquitto/config/passwd && 
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "
    networks:
      - hautoml_net

  # ==========================================
  # 5. MinIO Object Storage (S3-compatible)
  # ==========================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-password123456}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hautoml_net

  # ==========================================
  # 6. Apache Kafka (Event Streaming)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka}:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - hautoml_net

  # ==========================================
  # 7. MongoDB (Metadata Database)
  # ==========================================
  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hautoml_net

networks:
  hautoml_net:
    driver: bridge

volumes:
  mqtt_data:
  mqtt_log:
  minio_data:
  kafka_data:
  mongo_data:
