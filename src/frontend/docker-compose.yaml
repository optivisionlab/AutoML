services:
  hautoml-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hautoml-frontend:latest
    container_name: hautoml_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - apps/web/.env
    networks:
      - hautoml_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hautoml_net:
    name: hautoml_net
    external: true
