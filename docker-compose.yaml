services:
  hautoml_worker:
    image: optivisionlab/hautoml:v2.2
    container_name: hautoml-worker
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    environment:
      HOST_BACK_END: "hautoml-toolkit"
      MINIO_ENDPOINT: "minio:9000"
    networks:
      - hautoml-network
      - kafka-network
    command: python -m cluster.worker
    depends_on: # chờ hạ tầng sẵn sàng rồi mới chạy (tránh crash khi reboot)
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  hautoml_toolkit:
    image: optivisionlab/hautoml:v2.2
    container_name: hautoml-toolkit
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    environment:
      WORKER_LIST: "http://hautoml-worker:4000,"
      KAFKA_SERVER: "kafka:9092"
      MONGODB_CONNECT: "mongodb:27017"
      MINIO_ENDPOINT: "minio:9000"
      REDIRECT_URI: "http://hautoml-toolkit:9996"
      FRONTEND_URL: "http://hautoml-frontend:3000"
    ports:
      - "9996:9996"
    command: python app.py
    networks:
      - hautoml-network
      - kafka-network
    depends_on: # FIX: chờ Kafka/Mongo/MinIO "healthy" rồi mới chạy -> hết crash KafkaConnectionError khi reboot
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    logging: *default-logging

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck: # báo "healthy" khi broker đã sẵn sàng nhận kết nối
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *default-logging

  mongo:
    image: bitnami/mongodb:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGODB_ADVERTISED_HOSTNAME: "mongodb"
      ALLOW_EMPTY_PASSWORD: "yes" # FIX: cho phép mongo khởi động không mật khẩu (backend kết nối không auth)
    networks:
      - hautoml-network
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/bitnami/mongodb # FIX: giữ dữ liệu mongo qua các lần down/up (hết mất tài khoản)
    healthcheck: # báo "healthy" khi MongoDB trả lời ping
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: abc123 # your username
      MINIO_ROOT_PASSWORD: password123 # your password
    command: server /data --console-address ":9001"
    networks:
      - hautoml-network
    volumes:
      - minio_data:/data # FIX: giữ dataset + model qua các lần down/up (hết mất model)
    healthcheck: # báo "healthy" khi MinIO sẵn sàng
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  hautoml_frontend:
    image: optivisionlab/hautoml-frontend:v2.2
    container_name: hautoml-frontend
    restart: unless-stopped
    env_file:
      - ./src/frontend/.env
    # FIX: host network để NextAuth (server-side trong container) gọi backend qua
    # localhost:9996 giống trình duyệt -> hết lỗi ECONNREFUSED khi đăng nhập.
    network_mode: "host"
    command: npm run dev
    depends_on:
      - hautoml_toolkit
    logging: *default-logging

networks:
  hautoml-network:
    driver: bridge
  kafka-network:
    driver: bridge

volumes:
  kafka_data:
  mongo_data:
  minio_data:
